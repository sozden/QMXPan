[package]
name = "qmxpan"
version = "0.15.0"
authors = ["Şadan Özden"]
edition = "2021"
license = "MIT"
resolver = "2"
rust-version = "1.77"
description = "QMX/QMX+ için ESP32-S3 (Waveshare 4.3\") panadapter"

[features]
# Full paket: WiFi, web sayfası, OTA, DX cluster, yayılım sayfası.
# Lite paket: cargo build --release --no-default-features
default = ["online"]
online = []

[[bin]]
name = "qmxpan"
harness = false

[profile.release]
opt-level = 3
debug = true

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
log = "0.4"
anyhow = "1"
esp-idf-svc = { version = "0.53", features = ["critical-section"] }
embedded-graphics = "0.8"
u8g2-fonts = "0.8"
embedded-svc = "0.29"

[build-dependencies]
embuild = "0.33"

# QMX'ten gelen I/Q sesi (USB Audio Class host)
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/usb_host_uac", version = "^1" }

# QMX'in CAT seri portu (USB CDC-ACM host)
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/usb_host_cdc_acm", version = "^2" }

# FT8 çözücü: ft8_lib (MIT, kgoba) + QMXPan sarmalayıcısı (esp_idf_svc::sys::ft8)
[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components/ft8w"]
bindings_header = "components/ft8w/ft8w.h"
bindings_module = "ft8"

# RGB LCD, PSRAM ve önbellek işlevleri için ek C bağlantıları (esp_idf_svc::sys::extra)
[[package.metadata.esp-idf-sys.extra_components]]
bindings_header = "src/extra_bindings.h"
bindings_module = "extra"
