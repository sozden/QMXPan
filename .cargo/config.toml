[build]
target = "xtensa-esp32s3-espidf"
# esp-idf-sys Windows'ta çok kısa bir çıktı yolu istiyor (uzun yol sınırı)
target-dir = "D:/qpb"

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor --partition-table partitions.csv --flash-size 16mb"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32s3"
ESP_IDF_VERSION = "v5.4.2"
# Windows'ta uzun yol sorunlarını önlemek için ESP-IDF tek bir yerde tutulur.
ESP_IDF_TOOLS_INSTALL_DIR = "global"
# target-dir proje dışında olduğu için esp-idf-sys proje kökünü buradan öğrenir
# (yoksa Cargo.toml'daki ek bileşenleri ve sdkconfig.defaults'u göremez)
CARGO_WORKSPACE_DIR = { value = "", relative = true }
